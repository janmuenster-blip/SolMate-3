# SolMate OS – Beispielkonfiguration. Kopieren nach config.toml und anpassen.

[device]
# simulator = ohne Gerät ausprobieren
# cloud     = über den EET-Server (sol.eet.energy), funktioniert von überall
# local     = direkt im Heimnetz (ws://sun2plug.local:9124/), ohne Internet
mode = "simulator"
serial = "SIM-0001"          # Seriennummer des SolMate (steht auf dem Gerät / in der App)
# password = "..."           # besser: Umgebungsvariable SOLMATE_PASSWORD
# uri = "ws://192.168.1.50:9124/"   # optional, z. B. feste IP im lokalen Modus

[simulator]
speed = 60                   # 60 = eine simulierte Minute pro Sekunde
capacity_wh = 1600
pv_peak_w = 880

[control]
enabled = true               # Automatik beim Start an
interval_s = 30              # Abfrageintervall
legal_limit_w = 800          # gesetzliche Einspeisegrenze, wird nie überschritten
reserve_percent = 15         # Batterie nicht tiefer entladen als …
default_min_w = 0            # gilt außerhalb aller Zeitfenster
default_max_w = 800
max_temp_c = 60              # ab dieser Temperatur …
derate_w = 300               # … Einspeisung auf diesen Wert begrenzen

# Zeitfenster: Grundlast decken, wenn Sie zu Hause sind. Erstes passendes Fenster gewinnt.
[[control.schedule]]
name = "Morgen"
start = "06:00"
end = "09:00"
min_w = 200
max_w = 600

[[control.schedule]]
name = "Abend"
start = "17:00"
end = "23:00"
min_w = 250
max_w = 800

[[control.schedule]]
name = "Nacht (Grundlast)"
start = "23:00"
end = "06:00"
min_w = 80
max_w = 150

[[control.schedule]]
name = "Homeoffice-Mittag"
start = "11:30"
end = "13:30"
min_w = 300
max_w = 800
weekdays = [0, 1, 2, 3, 4]   # 0 = Montag

[boost]
# Der große Button oben in der App
watts = 800
minutes = 20

[ecoflow]
# off       = keine EcoFlow-Anbindung
# simulator = simulierter Stream + Smart Meter (nur zusammen mit dem SolMate-Simulator)
# cloud     = echte Geräte über die EcoFlow-Developer-API
mode = "off"
host = "api-e.ecoflow.com"   # Europa; sonst "api.ecoflow.com"
# access_key = "..."         # besser: Umgebungsvariablen ECOFLOW_ACCESS_KEY / ECOFLOW_SECRET_KEY
# secret_key = "..."
stream_sn = ""               # Seriennummer des Stream (Haupteinheit), siehe: solmate-os ecoflow-devices
# meter_sn = ""              # Seriennummer des EcoFlow Smart Meter (falls vorhanden)
grid_import_positive = true  # falls Netzbezug/Einspeisung vertauscht angezeigt werden: false
# balance       = der vollere Akku führt (empfohlen)
# solmate_first = SolMate deckt den Verbrauch zuerst, Stream den Rest
# stream_first  = Stream zuerst, SolMate springt bei Netzbezug ein
# monitor       = nur anzeigen und Haushaltsgrenze einhalten
strategy = "balance"
household_limit_w = 800      # SolMate + Stream zusammen
margin_w = 20                # kleiner Puffer gegen Netzeinspeisung
deadband_w = 25              # kleinere Änderungen werden nicht gesendet

[web]
host = "0.0.0.0"             # 127.0.0.1 = nur dieser Rechner; 0.0.0.0 = ganzes Heimnetz (fürs iPhone nötig)
port = 8080
# pin = "4711"               # PIN-Abfrage in der App (empfohlen, v. a. bei Zugriff von unterwegs)

[storage]
path = "solmate.sqlite3"
retention_days = 365

# ==================================================================================================
# Hausansicht fürs iPad: http://<ip>:8080/haus
# Müllabfuhr, Akkus aller Geräte, PowerStream mit Prognose, Stromtarif und Kosten.
# ==================================================================================================
[home]
title = "Unser Haus"
interval_s = 60              # wie oft die EcoFlow-Geräte abgefragt werden

# Weitere EcoFlow-Geräte (gleiche Schlüssel wie unter [ecoflow]). Seriennummern: solmate-os ecoflow-devices
# Der Stream aus [ecoflow] erscheint automatisch und muss hier nicht noch einmal stehen.
# Im Simulator werden ohne Einträge ein „Stream AC Pro“ und ein „PowerStream“ simuliert.
# [[home.devices]]
# name = "Stream AC Pro"
# sn = "BK31..."
# kind = "stream"            # stream | powerstream | auto
#
# [[home.devices]]
# name = "PowerStream"
# sn = "HW51..."
# kind = "powerstream"

# --- Müllabfuhr ---------------------------------------------------------------------------------
# Am einfachsten: den iCal-Link (Abo-Link / .ics-Export) vom Abfallkalender Ihrer Gemeinde eintragen.
# Mehrere Links sind möglich, z. B. ics_url = ["https://…/rest.ics", "https://…/gelb.ics"]
[home.waste]
# ics_url = "https://www.beispiel-abfallkalender.de/export/ical?strasse=…"
# ics_file = "abfall.ics"    # alternativ heruntergeladene Datei

# Ohne Kalenderdatei: feste Rhythmen. start = ein bekannter Abfuhrtermin.
[[home.waste.rules]]
type = "rest"                # rest | papier | gelb
start = 2026-11-25
every_weeks = 2

[[home.waste.rules]]
type = "gelb"
start = 2026-11-27
every_weeks = 2
moved = { "2026-12-25" = "2026-12-27" }   # Feiertagsverschiebung; "" = fällt aus

[[home.waste.rules]]
type = "papier"
start = 2026-12-03
every_weeks = 4

# Namen, Farben und Stichwörter der Tonnen (für die Zuordnung der Kalendereinträge) anpassbar:
# [home.waste.types.gelb]
# name = "Gelbe Tonne"
# keywords = ["gelb", "wertstoff"]
# [home.waste.types.bio]     # weitere Tonne hinzufügen
# name = "Biotonne"
# color = "#6b8e23"
# keywords = ["bio"]

# --- PV-Prognose (Open-Meteo, kostenlos) --------------------------------------------------------
# [home.forecast]
# latitude = 48.78            # Standort der Module
# longitude = 9.18
# max_ac_w = 800              # Wechselrichter-Grenze (PowerStream 600 oder 800)
# system_factor = 0.85        # Verluste
# [[home.forecast.planes]]    # je Modulfläche, z. B. PV1 und PV2 am PowerStream
# name = "Balkon"
# kwp = 0.86                  # Modulleistung in kWp (2 × 430 Wp = 0.86)
# tilt = 70                   # Neigung in Grad (0 = flach, 90 = senkrecht)
# azimuth = 0                 # 0 = Süd, -90 = Ost, 90 = West

# --- Stromtarif (aus der EnBW-App / „Mein EnBW“ übernehmen) ------------------------------------
[home.tariff]
provider = "EnBW"
name = "Komfort"              # Tarifname laut Vertrag
price_ct_kwh = 0              # Arbeitspreis brutto in ct/kWh, z. B. 36.5
base_eur_month = 0            # Grundpreis brutto in €/Monat, z. B. 14.90
deposit_eur_month = 0         # monatlicher Abschlag in €
# contract_start = 2026-01-01 # Beginn des Abrechnungszeitraums
# meter_start_kwh = 12345.6   # Zählerstand zu diesem Datum
# feed_in_ct_kwh = 0          # Einspeisevergütung (Balkonkraftwerk meist 0)
# app_url = "https://www.enbw.com/mein-enbw"   # Ziel des Buttons „EnBW-App öffnen“
