[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solmate-os"
version = "0.1.0"
description = "Steuer- und Überwachungssoftware für den EET SolMate 3"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["aiohttp>=3.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
solmate-os = "solmate_os.cli:main"

[tool.setuptools.packages.find]
include = ["solmate_os*"]

[tool.setuptools.package-data]
solmate_os = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
