<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Haus">
<meta name="theme-color" content="#eef1f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1217" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="manifest" href="/haus.webmanifest">
<title>Hausansicht</title>
<style>
  :root {
    --bg: #eef1f5; --card: #ffffff; --text: #1b2130; --muted: #6a7386; --line: #e1e5ec; --soft: #f4f6f9;
    --pv: #d99a00; --out: #2f7de1; --good: #1f9d63; --warn: #e08a00; --bad: #d64545; --accent: #2f7de1;
    --fc: #d99a00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1217; --card: #191e26; --text: #e8ebf1; --muted: #98a1b3; --line: #2a313d; --soft: #20262f;
      --pv: #f2b632; --out: #5b9cf0; --good: #3cc488; --warn: #ffa53a; --bad: #ef6b6b; --accent: #5b9cf0;
      --fc: #f2b632;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.4 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
         padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
         -webkit-user-select: none; user-select: none; }
  .wrap { max-width: 1366px; margin: 0 auto; padding: 10px 16px 12px; }

  header { display: flex; align-items: center; gap: 18px; margin-bottom: 8px; }
  header h1 { font-size: 24px; margin: 0; font-weight: 750; letter-spacing: -.01em; }
  header .date { color: var(--muted); font-size: 14px; }
  header .clock { margin-left: auto; font-size: 32px; font-weight: 300; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  header .weather { display: flex; align-items: center; gap: 8px; font-size: 15px; }
  header .weather .ico { font-size: 30px; line-height: 1; }
  header .weather b { font-size: 22px; font-weight: 600; }
  header a.nav { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 14px;
                 padding: 8px 12px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); }

  .banner { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 14px; margin-bottom: 12px;
            background: var(--warn); color: #fff; font-weight: 650; font-size: 17px; }
  .banner .ico { font-size: 24px; }

  .grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 10px; }
  .grid > * { min-width: 0; }
  .c-waste { grid-column: span 4; } .c-bat { grid-column: span 8; }
  .c-solar { grid-column: span 7; } .c-cost { grid-column: span 5; }
  .c-cost .btn { padding: 8px 12px; font-size: 14px; }
  @media (max-width: 900px) { /* Hochformat */
    .c-waste, .c-bat, .c-solar, .c-cost { grid-column: span 12; }
    .c-waste .bins { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .c-waste .bin { flex-direction: column; align-items: flex-start; }
  }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; }
  .card h2 { font-size: 12.5px; margin: 0 0 8px; color: var(--muted); font-weight: 650; text-transform: uppercase;
             letter-spacing: .05em; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .card h2 small { text-transform: none; letter-spacing: 0; font-weight: 500; font-size: 12.5px; }
  .muted { color: var(--muted); font-size: 13px; }
  .err { color: var(--bad); font-size: 12.5px; margin-top: 8px; }
  .num { font-variant-numeric: tabular-nums; }
  .unit { font-size: .55em; color: var(--muted); font-weight: 500; margin-left: 2px; }

  /* Müll */
  .bins { display: grid; gap: 10px; }
  .bin { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 14px; background: var(--soft);
         border: 2px solid transparent; }
  .bin.soon { border-color: var(--bin); background: color-mix(in srgb, var(--bin) 14%, var(--card)); }
  .bin svg { flex: none; width: 34px; height: 40px; }
  .bin .when { font-size: 20px; font-weight: 700; line-height: 1.15; }
  .bin .name { font-size: 13px; color: var(--muted); font-weight: 600; }
  .bin .more { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* Akkus */
  .bats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .bat { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 10px 6px;
         border-radius: 14px; background: var(--soft); }
  .ring { position: relative; width: 96px; height: 96px; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .pct { position: absolute; inset: 0; display: grid; place-items: center; font-size: 24px; font-weight: 700; }
  .bat .name { font-weight: 650; margin-top: 6px; font-size: 15px; }
  .bat .state { font-size: 13px; color: var(--muted); min-height: 18px; }
  .bat .off { color: var(--bad); }

  /* Solar */
  .solar-top { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 10px; }
  .kpi .l { font-size: 12.5px; color: var(--muted); }
  .kpi .v { font-size: 24px; font-weight: 700; line-height: 1.15; }
  .kpi .s { font-size: 12px; color: var(--muted); }
  .kpi.big .v { font-size: 32px; color: var(--pv); }
  canvas { width: 100%; height: 125px; display: block; }
  .flow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  .flow .v { font-size: 24px; font-weight: 700; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 6px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
  .days { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
  .day { background: var(--soft); border-radius: 12px; padding: 6px 10px; display: flex; align-items: center; gap: 10px; }
  .day .ico { font-size: 22px; line-height: 1; }
  .day b { display: block; font-size: 13px; }
  .day span { font-size: 12px; color: var(--muted); }

  /* Kosten */
  .tariff { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 4px; }
  .tariff .prov { font-weight: 750; font-size: 16px; display: inline; margin-right: 6px; }
  .tariff #tname { display: inline; }
  .btn { display: inline-block; border: 0; border-radius: 11px; padding: 10px 14px; font: inherit; font-weight: 650;
         background: var(--accent); color: #fff; text-decoration: none; cursor: pointer; white-space: nowrap; }
  .btn.sec { background: var(--soft); color: var(--text); border: 1px solid var(--line); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { padding: 4px 2px; border-bottom: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; }
  td:first-child, th:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 600; font-size: 12.5px; }
  .saved { color: var(--good); font-weight: 650; }
  .proj { margin-top: 8px; padding: 10px 12px; border-radius: 14px; background: var(--soft); }
  .proj .v { font-size: 21px; font-weight: 750; }
  .proj.plus .v { color: var(--good); } .proj.minus .v { color: var(--bad); }
  form.meter { display: flex; gap: 8px; margin-top: 8px; }
  form.meter input { flex: 1; min-width: 0; padding: 10px; border-radius: 11px; border: 1px solid var(--line);
                     background: var(--bg); color: var(--text); font: inherit; font-size: 16px; -webkit-user-select: text; user-select: text; }
  .foot { text-align: center; color: var(--muted); font-size: 12px; margin-top: 8px; }
  #toast { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
           background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; opacity: 0;
           transition: opacity .3s; pointer-events: none; }
  /* iPad quer (1024×768): alles ohne Scrollen auf einen Bildschirm */
  @media (orientation: landscape) and (max-height: 820px) {
    .bin .more { display: none; }
    .foot { position: fixed; right: 12px; bottom: 4px; margin: 0; font-size: 11px; opacity: .7; }
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="title">Unser Haus</h1>
      <div class="date" id="date">–</div>
    </div>
    <div class="weather" id="weather" hidden><span class="ico" id="wico"></span><div><b id="wtemp">–</b><div class="muted" id="wtext"></div></div></div>
    <div class="clock" id="clock">--:--</div>
    <a class="nav" href="/">SolMate ›</a>
  </header>

  <div class="banner" id="banner" hidden><span class="ico">🗑️</span><span id="bannertext"></span></div>

  <div class="grid">
    <section class="card c-waste">
      <h2>Müllabfuhr <small id="wasteinfo"></small></h2>
      <div class="bins" id="bins"></div>
      <div class="err" id="wasteerr" hidden></div>
    </section>

    <section class="card c-bat">
      <h2>Akkus <small id="batsum"></small></h2>
      <div class="bats" id="bats"></div>
      <div class="flow">
        <div class="kpi"><div class="l">☀️ Solar gesamt</div><div class="v num" id="hsolar">–</div></div>
        <div class="kpi"><div class="l">🏠 Hausverbrauch</div><div class="v num" id="hload">–</div></div>
        <div class="kpi"><div class="l" id="hgridl">🔌 Netz</div><div class="v num" id="hgrid">–</div></div>
      </div>
    </section>

    <section class="card c-solar">
      <h2>Solar · PowerStream <small id="solarinfo"></small></h2>
      <div class="solar-top">
        <div class="kpi big"><div class="l">Erzeugung jetzt</div><div class="v num" id="pvnow">–</div><div class="s" id="pvsplit"></div></div>
        <div class="kpi"><div class="l">Ins Haus</div><div class="v num" id="pvout">–</div><div class="s" id="pvfcnow"></div></div>
        <div class="kpi"><div class="l">Heute</div><div class="v num" id="pvtoday">–</div><div class="s" id="pvtodayfc"></div></div>
        <div class="kpi"><div class="l">Morgen</div><div class="v num" id="pvtomorrow">–</div><div class="s" id="pvrest"></div></div>
      </div>
      <canvas id="chart"></canvas>
      <div class="legend"><span><i style="background:var(--fc);opacity:.5"></i>Prognose</span><span><i style="background:var(--out)"></i>Tatsächlich</span><span><i style="background:var(--muted)"></i>Jetzt</span></div>
      <div class="days" id="days"></div>
      <div class="err" id="solarerr" hidden></div>
    </section>

    <section class="card c-cost">
      <h2>Strom &amp; Kosten</h2>
      <div class="tariff">
        <div><div class="prov" id="prov">EnBW</div><div class="muted" id="tname">–</div></div>
        <a class="btn" id="enbw" href="https://www.enbw.com/mein-enbw" target="_blank" rel="noopener">EnBW-App öffnen</a>
      </div>
      <div id="costbody">
        <table>
          <thead><tr><th></th><th>Heute</th><th>Monat</th></tr></thead>
          <tbody id="costs"></tbody>
        </table>
        <div class="proj" id="proj" hidden><div class="v num" id="projv"></div><div class="muted" id="projs"></div></div>
      </div>
      <div class="muted" id="costhint" hidden style="margin-top:8px"></div>
      <form class="meter" id="meterform">
        <input id="meterkwh" type="number" inputmode="decimal" step="0.1" min="0" placeholder="kWh" required>
        <button class="btn sec" type="submit">Zählerstand ✓</button>
      </form>
    </section>
  </div>
  <div class="foot" id="foot"></div>
</div>
<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const fmt = (v, d = 0) => (v === null || v === undefined || isNaN(v)) ? "–" : Number(v).toLocaleString("de-DE", { minimumFractionDigits: d, maximumFractionDigits: d });
const eur = (v) => v == null ? "–" : `${fmt(v, 2)} €`;
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc = (t) => { const d = document.createElement("div"); d.textContent = t == null ? "" : t; return d.innerHTML; };
let data = null;

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.style.opacity = 1;
  clearTimeout(toast.h); toast.h = setTimeout(() => t.style.opacity = 0, 2600);
}

async function api(path, body) {
  const res = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }
                                     : { cache: "no-store" });
  if (res.status === 401) { location.href = "/login?next=/haus"; throw new Error("PIN erforderlich"); }
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

function tick() {
  const n = new Date();
  $("clock").textContent = n.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
  $("date").textContent = n.toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long" });
}

const binSvg = (c) => `<svg viewBox="0 0 42 48" aria-hidden="true"><rect x="3" y="7" width="36" height="5" rx="2" fill="${c}"/>
  <path d="M6 13h30l-3 31a3 3 0 0 1-3 3H12a3 3 0 0 1-3-3z" fill="${c}"/><rect x="16" y="3" width="10" height="4" rx="1.5" fill="${c}"/>
  <path d="M15 19v21M21 19v21M27 19v21" stroke="rgba(255,255,255,.55)" stroke-width="2" stroke-linecap="round"/></svg>`;

function renderWaste(w) {
  $("banner").hidden = !w.reminder; $("bannertext").textContent = w.reminder || "";
  $("wasteerr").hidden = !w.error; $("wasteerr").textContent = w.error || "";
  if (!w.configured) {
    $("bins").innerHTML = `<div class="muted">Noch kein Abfallkalender eingerichtet – siehe <code>[home.waste]</code> in der config.toml.</div>`;
    return;
  }
  $("bins").innerHTML = w.bins.map(b => {
    const days = "";
    const more = b.upcoming.slice(1, 3).map(d => new Date(d + "T12:00").toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" })).join(" · ");
    return `<div class="bin ${b.in_days != null && b.in_days <= 1 ? "soon" : ""}" style="--bin:${esc(b.color)}">${binSvg(esc(b.color))}
      <div><div class="name">${esc(b.name)}${b.in_days > 1 ? ` · in ${b.in_days} Tagen` : ""}</div><div class="when">${esc(b.label)}</div>
      <div class="more">${days}${days && more ? " · " : ""}${more ? "danach " + more : ""}</div></div></div>`;
  }).join("");
}

function ring(p, color) {
  const r = 50, c = 2 * Math.PI * r, v = p == null ? 0 : Math.max(0, Math.min(100, p));
  return `<svg viewBox="0 0 116 116"><circle cx="58" cy="58" r="${r}" fill="none" stroke="var(--line)" stroke-width="11"/>
    <circle cx="58" cy="58" r="${r}" fill="none" stroke="${color}" stroke-width="11" stroke-linecap="round"
      stroke-dasharray="${c * v / 100} ${c}"/></svg>`;
}

function renderBatteries(list) {
  if (!list.length) { $("bats").innerHTML = `<div class="muted">Keine Akkus eingerichtet.</div>`; return; }
  const socs = list.filter(b => b.soc_percent != null);
  $("batsum").textContent = socs.length > 1 ? `Ø ${fmt(socs.reduce((a, b) => a + b.soc_percent, 0) / socs.length)} %` : "";
  $("bats").innerHTML = list.map(b => {
    const p = b.soc_percent;
    const color = p == null ? "var(--muted)" : p < 20 ? "var(--bad)" : p < 40 ? "var(--warn)" : "var(--good)";
    let state = "";
    if (!b.online) state = `<span class="off">offline</span>`;
    else if (b.battery_w > 5) state = `⚡ lädt ${fmt(b.battery_w)} W`;
    else if (b.battery_w < -5) state = `entlädt ${fmt(-b.battery_w)} W`;
    else state = "Ruhe";
    if (b.online && b.out_w > 5) state += ` · gibt ${fmt(b.out_w)} W ab`;
    return `<div class="bat" title="${esc(b.error || "")}"><div class="ring">${ring(p, color)}<div class="pct num"><span>${p == null ? "–" : fmt(p) + "<span class='unit'>%</span>"}</span></div></div>
      <div class="name">${esc(b.name)}</div><div class="state">${state}</div></div>`;
  }).join("");
}

function kwh(v) { return v == null ? "–" : `${fmt(v, 2)}<span class="unit">kWh</span>`; }
function W(v) { return v == null ? "–" : `${fmt(v)}<span class="unit">W</span>`; }

function renderSolar(s, deviceTime) {
  const ps = s.powerstreams, fc = s.forecast;
  const pv = ps.length ? ps.reduce((a, p) => a + (p.pv_w || 0), 0) : null;
  const out = ps.length ? ps.reduce((a, p) => a + (p.out_w || 0), 0) : null;
  const today = ps.length ? ps.reduce((a, p) => a + (p.today_kwh || 0), 0) : null;
  $("pvnow").innerHTML = W(pv);
  const p0 = ps[0];
  $("pvsplit").textContent = p0 && (p0.pv1_w != null || p0.pv2_w != null) ? `PV1 ${fmt(p0.pv1_w)} W · PV2 ${fmt(p0.pv2_w)} W` : (ps.length ? "" : "kein PowerStream eingerichtet");
  $("pvout").innerHTML = W(out);
  $("pvfcnow").textContent = fc && fc.now_w != null ? `Prognose jetzt ${fmt(fc.now_w)} W` : "";
  $("pvtoday").innerHTML = kwh(today);
  $("pvtodayfc").textContent = fc ? `Prognose ${fmt(fc.today_kwh, 2)} kWh` : "";
  $("pvtomorrow").innerHTML = fc ? kwh(fc.tomorrow_kwh) : "–";
  $("pvrest").textContent = fc ? `heute noch ≈ ${fmt(fc.rest_today_kwh, 1)} kWh` : "";
  $("solarinfo").textContent = s.forecast_configured ? "" : "Prognose: [home.forecast] einrichten";
  const errs = [s.forecast_error, ...ps.map(p => p.error)].filter(Boolean);
  $("solarerr").hidden = !errs.length; $("solarerr").textContent = errs.join(" · ");
  $("days").innerHTML = fc && fc.days ? fc.days.map((d, i) => {
    const name = i === 0 ? "Heute" : i === 1 ? "Morgen" : new Date(d.date + "T12:00").toLocaleDateString("de-DE", { weekday: "short" });
    return `<div class="day"><span class="ico">${d.icon}</span><div><b>${name} · ${fmt(d.kwh, 1)} kWh</b>
      <span>${fmt(d.t_min)}° / ${fmt(d.t_max)}° · ☀ ${fmt(d.sun_h, 1)} h</span></div></div>`;
  }).join("") : "";
  drawChart(s, deviceTime);
}

function drawChart(s, deviceTime) {
  const c = $("chart"), dpr = window.devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;
  c.width = w * dpr; c.height = h * dpr;
  const g = c.getContext("2d"); g.scale(dpr, dpr); g.clearRect(0, 0, w, h);
  const fc = s.forecast ? s.forecast.points : [];
  // Lokale Zeitstempel ohne Zone (Prognose) und UTC (Messwerte) auf eine Achse bringen.
  const now = deviceTime ? new Date(deviceTime) : new Date();
  const t0 = new Date(now); t0.setHours(5, 0, 0, 0);
  const t1 = new Date(t0); t1.setDate(t1.getDate() + 1); t1.setHours(21, 0, 0, 0);
  const pts = fc.map(p => ({ t: new Date(p.ts), w: p.w })).filter(p => p.t >= t0 && p.t <= t1);
  const act = (s.actual || []).map(p => ({ t: new Date(p.ts), w: p.w }));
  const pad = { l: 38, r: 8, t: 8, b: 20 }, pw = w - pad.l - pad.r, ph = h - pad.t - pad.b;
  const maxW = Math.max(100, ...pts.map(p => p.w), ...act.map(p => p.w)) * 1.1;
  // Die Nacht wird zusammengeschoben: Heute 05–21 Uhr, dann Morgen 05–21 Uhr.
  const day0 = t0.getTime(), span = 16 * 3600e3;
  const xf = (t) => { const tt = t.getTime(); const dd = Math.floor((tt - day0 + 8 * 3600e3) / 86400e3);
    const within = Math.max(0, Math.min(span, tt - day0 - dd * 86400e3)); return pad.l + (dd * span + within) / (2 * span) * pw; };
  const y = (v) => pad.t + ph - v / maxW * ph;
  g.font = "11px -apple-system, system-ui"; g.fillStyle = css("--muted"); g.strokeStyle = css("--line"); g.lineWidth = 1;
  for (let i = 0; i <= 3; i++) {
    const yy = pad.t + ph * i / 3; g.beginPath(); g.moveTo(pad.l, yy); g.lineTo(pad.l + pw, yy); g.stroke();
    g.textAlign = "right"; g.fillText(Math.round(maxW * (1 - i / 3)), pad.l - 5, yy + 4);
  }
  g.beginPath(); g.moveTo(pad.l + pw / 2, pad.t); g.lineTo(pad.l + pw / 2, pad.t + ph); g.stroke();
  g.textAlign = "center";
  [["Heute", 0], ["Morgen", 1]].forEach(([lbl, d]) => {
    for (const hh of [8, 12, 16]) {
      const t = new Date(t0); t.setDate(t.getDate() + d); t.setHours(hh, 0, 0, 0);
      g.fillText(`${hh}:00`, xf(t), h - 5);
    }
    g.textAlign = "left"; g.fillText(lbl, pad.l + 4 + d * pw / 2, pad.t + 12); g.textAlign = "center";
  });
  if (pts.length > 1) {
    for (const d of [0, 1]) {
      const seg = pts.filter(p => Math.floor((p.t.getTime() - day0 + 8 * 3600e3) / 86400e3) === d);
      if (seg.length < 2) continue;
      g.beginPath(); seg.forEach((p, i) => i ? g.lineTo(xf(p.t), y(p.w)) : g.moveTo(xf(p.t), y(p.w)));
      g.strokeStyle = css("--fc"); g.globalAlpha = .7; g.lineWidth = 2; g.stroke();
      g.lineTo(xf(seg[seg.length - 1].t), y(0)); g.lineTo(xf(seg[0].t), y(0)); g.closePath();
      g.globalAlpha = .16; g.fillStyle = css("--fc"); g.fill(); g.globalAlpha = 1;
    }
  } else {
    g.fillText("Keine Prognose", pad.l + pw / 2, pad.t + ph / 2);
  }
  if (act.length > 1) {
    g.beginPath(); act.forEach((p, i) => i ? g.lineTo(xf(p.t), y(p.w)) : g.moveTo(xf(p.t), y(p.w)));
    g.strokeStyle = css("--out"); g.lineWidth = 2; g.stroke();
  }
  if (now >= t0 && now <= t1) {
    g.setLineDash([3, 3]); g.strokeStyle = css("--muted"); g.beginPath(); g.moveTo(xf(now), pad.t); g.lineTo(xf(now), pad.t + ph); g.stroke(); g.setLineDash([]);
  }
}

function renderCosts(t, hasMeter) {
  $("prov").textContent = t.provider || "Stromtarif";
  $("tname").textContent = t.configured ? `${t.name ? t.name + " · " : ""}${fmt(t.price_ct_kwh, 2)} ct · ${fmt(t.base_eur_month, 2)} €/Mon.` : "Tarif noch nicht eingetragen";
  $("enbw").href = t.app_url || "https://www.enbw.com/mein-enbw";
  $("enbw").textContent = `${t.provider || "EnBW"}-App öffnen`;
  const d = t.today, m = t.month;
  const rows = [];
  if (hasMeter) {
    rows.push(["Netzbezug", `${fmt(d.import_kwh, 2)} kWh`, `${fmt(m.import_kwh, 1)} kWh`]);
    rows.push(["Kosten inkl. Grundpreis", eur(d.total_eur), eur(m.total_eur)]);
  }
  rows.push(["Eigener Solarstrom", `${fmt(d.own_kwh, 2)} kWh`, `${fmt(m.own_kwh, 1)} kWh`]);
  rows.push([`<span class="saved">Gespart</span>`, `<span class="saved">${eur(d.saved_eur)}</span>`, `<span class="saved">${eur(m.saved_eur)}</span>`]);
  $("costs").innerHTML = rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("");
  const hints = [];
  if (!t.configured) hints.push("Arbeitspreis, Grundpreis und Abschlag aus der EnBW-App unter [home.tariff] eintragen.");
  if (!hasMeter) hints.push("Netzbezug wird mit dem EcoFlow Smart Meter gemessen; ohne ihn nur Ersparnis.");
  const p = t.projection, box = $("proj");
  box.hidden = !p;
  if (p) {
    if (p.balance_eur != null) {
      box.className = "proj " + (p.balance_eur >= 0 ? "plus" : "minus");
      $("projv").textContent = `${p.balance_eur >= 0 ? "Guthaben" : "Nachzahlung"} ≈ ${eur(Math.abs(p.balance_eur))}`;
      $("projs").textContent = `Hochrechnung: ${fmt(p.year_kwh)} kWh/Jahr = ${eur(p.year_cost_eur)}, Abschläge ${eur(p.deposits_eur)} · passender Abschlag ${eur(p.fair_deposit_eur)}`;
    } else {
      box.className = "proj";
      $("projv").textContent = `${fmt(p.year_kwh)} kWh · ${eur(p.year_cost_eur)} / Jahr`;
      $("projs").textContent = `Hochrechnung · ${fmt(p.per_day_kwh, 1)} kWh pro Tag`;
    }
  } else if (t.configured) hints.push("Für die Jahreshochrechnung Zählerstände eintragen (wie in der EnBW-App).");
  $("costhint").hidden = !hints.length; $("costhint").textContent = hints.join(" ");
  const last = t.readings.length ? t.readings[t.readings.length - 1] : null;
  $("meterkwh").placeholder = last ? `${new Date(last.day + "T12:00").toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" })}: ${fmt(last.kwh, 1)} kWh` : "Zählerstand in kWh";
}

function render(d) {
  data = d;
  $("title").textContent = d.title;
  document.title = d.title;
  const fc = d.solar.forecast;
  $("weather").hidden = !(fc && fc.weather);
  if (fc && fc.weather) { $("wico").textContent = fc.weather.icon; $("wtemp").textContent = `${fmt(fc.weather.temp_c, 1)} °C`; $("wtext").textContent = fc.weather.text; }
  renderWaste(d.waste);
  renderBatteries(d.batteries);
  renderSolar(d.solar, d.device_time);
  renderCosts(d.tariff, d.has_smart_meter);
  const hs = d.house || {};
  $("hsolar").innerHTML = W(hs.solar_w); $("hload").innerHTML = W(hs.load_w);
  $("hgridl").textContent = hs.grid_w == null ? "🔌 Netz" : hs.grid_w >= 0 ? "🔌 Netzbezug" : "🔌 Einspeisung";
  $("hgrid").innerHTML = W(hs.grid_w == null ? null : Math.abs(hs.grid_w));
  $("foot").textContent = `Aktualisiert ${new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })}` + (d.simulated ? " · Simulator" : "");
}

async function refresh() {
  try { render(await api("/api/home")); }
  catch (e) { $("foot").textContent = "Server nicht erreichbar – versuche es erneut …"; }
}

$("meterform").onsubmit = async (ev) => {
  ev.preventDefault();
  const v = parseFloat($("meterkwh").value.replace(",", "."));
  if (isNaN(v)) return;
  try { render(await api("/api/home/meter", { kwh: v })); $("meterkwh").value = ""; $("meterkwh").blur(); toast("Zählerstand gespeichert"); }
  catch (e) { toast("Fehler: " + e.message); }
};

// Bildschirm anlassen, solange die Hausansicht offen ist (iPadOS 16.4+; sonst Auto-Sperre in den Einstellungen).
let lock = null;
async function keepAwake() {
  try { if ("wakeLock" in navigator && !document.hidden) lock = await navigator.wakeLock.request("screen"); } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) { refresh(); keepAwake(); } });
window.addEventListener("resize", () => data && drawChart(data.solar, data.device_time));
if ("serviceWorker" in navigator && window.isSecureContext) navigator.serviceWorker.register("/sw.js").catch(() => {});

tick(); setInterval(tick, 1000);
refresh(); setInterval(() => { if (!document.hidden) refresh(); }, 30000);
keepAwake();
// Um Mitternacht neu laden (neuer Tag, Speicher frisch).
setInterval(() => { const n = new Date(); if (n.getHours() === 0 && n.getMinutes() === 0 && n.getSeconds() < 2) location.reload(); }, 1000);
</script>
